server.port=8080

spring.application.name=prostore

# Defaults target the db service as published on the host (see docker-compose.yml),
# so `./gradlew bootRun` works against `docker compose up db` without extra setup.
# The env vars let docker-compose's own backend service override these to reach
# the db container directly instead.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/prostore}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:prostore}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:prostore}

# Since Flyway is part of the project and owns the schema, letting Hibernate also
# auto-generate DDL is redundant. This also risks Flyway and Hibernate fighting each other.
# Validation option here tells Hibernate to check project entities against Flyway's schema.
# If there's a deviation between the two, a loud failure follows.
spring.jpa.hibernate.ddl-auto=validate