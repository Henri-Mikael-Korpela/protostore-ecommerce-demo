plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.4'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.prostore'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.flywaydb:flyway-core'

	// From Flyway v10 onwards, PostgreSQL support was split into its own module.
	// Necessary to recognize PostgreSQL dialect.
	implementation 'org.flywaydb:flyway-database-postgresql'

	// The JDBC driver both Flyway and Hibernate require at runtime
	implementation 'org.postgresql:postgresql'

	// Standard choice for typical CRUD-heavy applications.
	// Repository interface helps with query creation.
	// Good integration with transactions and validation.
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// Reads docker-compose's .env so both `bootRun` and `test` connect to the same
// `db` service (see docker-compose.yml) with its real credentials, instead of
// relying on the fallback defaults in application.properties.
def configureDatasourceFromEnvFile = { task ->
	def envFile = file('../.env')
	if (envFile.exists()) {
		def env = new Properties()
		envFile.withInputStream { env.load(it) }
		task.environment 'SPRING_DATASOURCE_URL', "jdbc:postgresql://localhost:${env.getProperty('DB_PORT_TO_HOST', '5433')}/${env.getProperty('DB_NAME', 'prostore')}"
		task.environment 'SPRING_DATASOURCE_USERNAME', env.getProperty('DB_USER', 'prostore')
		task.environment 'SPRING_DATASOURCE_PASSWORD', env.getProperty('DB_PASSWORD', 'prostore')
	}
}

tasks.named('bootRun') {
	configureDatasourceFromEnvFile(it)

	// Seed the dev database with the same basic fixture the integration tests
	// use, so there's always something to see when running the app locally.
	environment 'SPRING_SQL_INIT_MODE', 'always'
	environment 'SPRING_SQL_INIT_DATA_LOCATIONS', 'file:src/test/resources/testdata/books-basic.sql'
}

// BooksControllerIntegrationTest needs a real Postgres to run Flyway migrations
// and testdata fixtures against; it connects to the docker-compose `db` service
// the same way `bootRun` does. Run `docker compose up db` first.
tasks.named('test') {
	useJUnitPlatform()
	configureDatasourceFromEnvFile(it)
}
